name: Runner routing

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-runner-routing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile Python bridge and hook
        run: |
          python -m py_compile src/rdc_runner_bridge.py
          python -m py_compile src/rdc_runner_hook.py
      - name: Runner routing unit tests
        run: python -m unittest tests.test_rdc_runner_bridge tests.test_rdc_runner_hook -v
      - name: Runner policy JavaScript tests
        run: node --test tests/runner-policy.test.mjs
      - name: Guardian PowerShell parse
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'src/RdcGuardian.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
