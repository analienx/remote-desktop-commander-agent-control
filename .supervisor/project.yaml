name: remote-desktop-commander-agent-control
description: Self-healing keep-alive, watchdog and status dashboard for the Desktop Commander remote agent and Chrome Remote Desktop on Windows.
execution:
  default_mode: host_specialist
  optional_modes: [recovery_only]
  notes: RDC is a transport/health boundary and bulk MCP consumer under Foundry v3; typed host operations only, no scheduling or model routing.
